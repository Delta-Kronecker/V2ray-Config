    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🇰🇿_13"
      - "🇰🇿_14"
      - "🇰🇿_15"
      - "🇰🇿_16"
