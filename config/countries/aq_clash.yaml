name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇦🇶_1"
    type: vless
    server: "2.26.255.206"
    port: 443
    uuid: "d9d0f208-d582-41d5-bb7b-742671402810"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "eu-central-pl-1.hanvpn.biz"
    client-fingerprint: "edge"
    reality-opts:
      public-key: "NjIuu35vz5MthSzqd6kt8PbXbZxCCL2Rb2GbpMCRTEY"
      short-id: "12e3b7681806bc97"
    flow: "xtls-rprx-vision"
  - name: "🇦🇶_2"
    type: vless
    server: "2.26.255.36"
    port: 8443
    uuid: "8787dd0a-095a-414e-804f-a7d16a1ae166"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "po1.hys.braidx.tech"
    client-fingerprint: "firefox"
    flow: "xtls-rprx-vision"
  - name: "🇦🇶_3"
    type: vless
    server: "eu-central-pl-1.hanvpn.biz"
    port: 443
    uuid: "d9d0f208-d582-41d5-bb7b-742671402810"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "eu-central-pl-1.hanvpn.biz"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "NjIuu35vz5MthSzqd6kt8PbXbZxCCL2Rb2GbpMCRTEY"
      short-id: "12e3b7681806bc97"
    flow: "xtls-rprx-vision"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇦🇶_1"
      - "🇦🇶_2"
      - "🇦🇶_3"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇦🇶_1"
      - "🇦🇶_2"
      - "🇦🇶_3"

rules:
  - MATCH,PROXY
