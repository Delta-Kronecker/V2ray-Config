name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇦🇪_1"
    type: vless
    server: "46.8.125.64"
    port: 443
    uuid: "dc413f44-7dce-4cc4-b2c7-878ef70ce464"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "dubai-cdn-keno.keno.su"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "9MgNwdrftjPf18DG8qYo6iHJw7IG7uSnULScDQ0WDy4"
      short-id: "0123456789abcdef"
    flow: "xtls-rprx-vision"
  - name: "🇦🇪_2"
    type: vless
    server: "dubai-cdn-keno.keno.su"
    port: 443
    uuid: "dc413f44-7dce-4cc4-b2c7-878ef70ce464"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "dubai-cdn-keno.keno.su"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "9MgNwdrftjPf18DG8qYo6iHJw7IG7uSnULScDQ0WDy4"
      short-id: "0123456789abcdef"
    flow: "xtls-rprx-vision"
  - name: "🇦🇪_3"
    type: trojan
    server: "154.90.55.81"
    port: 443
    password: "af4b064a9c39472fb34ad8b113acdc6b"
    sni: "154.90.55.81"
    skip-cert-verify: true
    udp: true

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇦🇪_1"
      - "🇦🇪_2"
      - "🇦🇪_3"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇦🇪_1"
      - "🇦🇪_2"
      - "🇦🇪_3"

rules:
  - MATCH,PROXY
