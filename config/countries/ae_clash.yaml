name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇦🇪_1"
    type: vless
    server: "84.235.244.108"
    port: 22573
    uuid: "39947382-3212-41c9-bc3a-589574ac8b23"
    udp: true
    network: ws
    ws-opts:
      path: "/"
      headers:
        Host: "uae.unixzone.us"
  - name: "🇦🇪_2"
    type: vless
    server: "185.225.195.30"
    port: 8880
    uuid: "6202b230-417c-4d8e-b624-0f71afa9c75d"
    udp: true
    network: ws
    ws-opts:
      path: "/"
      headers:
        Host: "vms.lifetime18.workers.dev"
  - name: "🇦🇪_3"
    type: vless
    server: "77.232.140.40"
    port: 8880
    uuid: "6202b230-417c-4d8e-b624-0f71afa9c75d"
    udp: true
    network: ws
    ws-opts:
      path: "/?ed"
      headers:
        Host: "vms.lifetime61.workers.dev"
  - name: "🇦🇪_4"
    type: vless
    server: "uae.unixzone.us"
    port: 22573
    uuid: "39947382-3212-41c9-bc3a-589574ac8b23"
    udp: true
    network: ws
    ws-opts:
      path: "/"
  - name: "🇦🇪_5"
    type: vless
    server: "94.140.0.100"
    port: 8880
    uuid: "78e6619e-e82a-cd8d-b482-0973d8498305"
    udp: true
    network: ws
    ws-opts:
      path: "/sync"
      headers:
        Host: "silent-pine-a674.jfadwkglaugul.workers.dev"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇦🇪_1"
      - "🇦🇪_2"
      - "🇦🇪_3"
      - "🇦🇪_4"
      - "🇦🇪_5"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇦🇪_1"
      - "🇦🇪_2"
      - "🇦🇪_3"
      - "🇦🇪_4"
      - "🇦🇪_5"

rules:
  - MATCH,PROXY
