name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 94.140.14.14
    - 64.6.64.6
    - 84.200.69.80
    - 76.76.19.19
    - 8.26.56.26
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://doh.comodo.com/dns-query
    - https://doh.mullvad.net/dns-query
    - https://doh.dns.mullvad.net/dns-query
    - https://freedns.controld.com/p0
    - https://freedns.controld.com/family

proxies:
  - name: "🇧🇷_1"
    type: vless
    server: "185.133.35.10"
    port: 443
    uuid: "05000d14-abf6-45e0-b51a-16469cdea06a"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "feijige.rujiao.icu"
    network: ws
    ws-opts:
      path: "/?Telegram-WangCai2"
      headers:
        Host: "feijige.rujiao.icu"
  - name: "🇧🇷_2"
    type: vless
    server: "177.3.213.230"
    port: 3443
    uuid: "11b7e901-e970-4491-9c7d-13c153e39e5b"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "get.wlrus.cfd"
    client-fingerprint: "edge"
    network: grpc
    grpc-opts:
      grpc-service-name: ""
  - name: "🇧🇷_3"
    type: vless
    server: "45.194.53.10"
    port: 443
    uuid: "b940be1b-3998-45d2-bf7b-06e7b6c4987a"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "2026080908.yzqiang.de5.net"
    network: ws
    ws-opts:
      path: "/?Telegram-WangCai2"
      headers:
        Host: "2026080908.yzqiang.de5.net"
  - name: "🇧🇷_4"
    type: vless
    server: "177.3.213.230"
    port: 5443
    uuid: "11b7e901-e970-4491-9c7d-13c153e39e5b"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "get.wlrus.cfd"
