name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇲🇩_1"
    type: vless
    server: "185.103.167.76"
    port: 4443
    uuid: "d7c94b82-657a-4bb7-9b24-2ae566669835"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "moldova.cdn-europe.org"
    client-fingerprint: "random"
    reality-opts:
      public-key: "cYwrRCz_hKgT_JE8WywuLE3XOkAEqCTuBiUvXAaEjn8"
      short-id: "694ee64512cfcbef"
    flow: "xtls-rprx-vision"
  - name: "🇲🇩_2"
    type: vless
    server: "moldova.cdn-europe.org"
    port: 4443
    uuid: "d7c94b82-657a-4bb7-9b24-2ae566669835"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "moldova.cdn-europe.org"
    client-fingerprint: "random"
    reality-opts:
      public-key: "cYwrRCz_hKgT_JE8WywuLE3XOkAEqCTuBiUvXAaEjn8"
      short-id: "694ee64512cfcbef"
    flow: "xtls-rprx-vision"
  - name: "🇲🇩_3"
    type: vless
    server: "80.96.109.15"
    port: 443
    uuid: "cd3bb7d9-7df3-4644-ac05-c260990ac277"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "moldova.failspace.top"
    client-fingerprint: "firefox"
    flow: "xtls-rprx-vision"
  - name: "🇲🇩_4"
    type: vless
    server: "moldova.failspace.top"
    port: 443
    uuid: "cd3bb7d9-7df3-4644-ac05-c260990ac277"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "moldova.failspace.top"
    client-fingerprint: "chrome"
    flow: "xtls-rprx-vision"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇲🇩_1"
      - "🇲🇩_2"
      - "🇲🇩_3"
      - "🇲🇩_4"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇲🇩_1"
      - "🇲🇩_2"
      - "🇲🇩_3"
      - "🇲🇩_4"

rules:
  - MATCH,PROXY
