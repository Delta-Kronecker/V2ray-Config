    skip-cert-verify: true
    servername: "github.com"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "FWitre1jinQR7qz5HQ0q2Q4Gg9xA9B0SyizCziN7Ch0"
      short-id: ""
    network: grpc
    grpc-opts:
      grpc-service-name: "GunService"
