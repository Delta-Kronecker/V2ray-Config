name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇲🇩_1"
    type: vless
    server: "144.31.131.241"
    port: 8443
    uuid: "b406bc51-9002-474c-beae-b194b02c91da"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "mold.speedload.online"
    reality-opts:
      public-key: "J5ITJbg5FQFembAfkogKHHQB6DigsFXQxK7xu-QMWUs"
      short-id: "a20d3ed244c76426"
    flow: "xtls-rprx-vision"
  - name: "🇲🇩_2"
    type: vless
    server: "80.96.109.223"
    port: 443
    uuid: "74f73fb2-49cc-4744-bd37-97c5f83963ab"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "hotcoals.aeternavpn.space"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "RWu6ktBE4DFbUz_prmz-5KuolLhO53ehh19mNxhP-wI"
      short-id: "a1b2c3d4"
    flow: "xtls-rprx-vision"
  - name: "🇲🇩_3"
    type: vless
    server: "85.121.5.199"
    port: 443
    uuid: "04d17971-314f-4922-8e91-d03dc2303353"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "md.dendiboss.org"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "PQm4_ELMk_t2_-78lisq7Pt3aal3IVaC519prE_-Fh8"
      short-id: "9c2378562188c3cb"
    flow: "xtls-rprx-vision"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇲🇩_1"
      - "🇲🇩_2"
      - "🇲🇩_3"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇲🇩_1"
      - "🇲🇩_2"
      - "🇲🇩_3"

rules:
  - MATCH,PROXY
