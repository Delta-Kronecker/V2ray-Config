name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇳🇴_1"
    type: vless
    server: "89.185.81.95"
    port: 8765
    uuid: "df9f5aca-eda0-428f-a752-e53866153d12"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "r-b8a34c.vless.monster"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "Da_s-Cgqm5kqaIbCgXVJdrq_KF7fCQveRByRhKUzonc"
      short-id: "7bf47eabf939728b"
    flow: "xtls-rprx-vision"
  - name: "🇳🇴_2"
    type: vless
    server: "46.29.238.88"
    port: 40443
    uuid: "db320947-adfb-400d-b60b-383b8324bffe"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "deepl.com"
    client-fingerprint: "qq"
    reality-opts:
      public-key: "aZOpodpnifoxDqTzWgxJRffgsiGnG9-h-EZd4SvOImc"
      short-id: "f7b2"
  - name: "🇳🇴_3"
