name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇱🇹_1"
    type: vless
    server: "107.181.151.128"
    port: 443
    uuid: "e5bfbdaf-b48e-492e-ba75-4278c437a0ec"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "www.mozilla.org"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "zfsjt2A8ur0qHWIuCG7F9W4wZN3VTuL6fkTljC-9R0s"
      short-id: "6765a8f49c21"
    flow: "xtls-rprx-vision"
  - name: "🇱🇹_2"
    type: vless
    server: "107.181.151.128"
    port: 443
    uuid: "75113671-63e3-452d-87d3-261a37e8b472"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "www.mozilla.org"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "zfsjt2A8ur0qHWIuCG7F9W4wZN3VTuL6fkTljC-9R0s"
      short-id: "baf023e1026a"
    flow: "xtls-rprx-vision"
  - name: "🇱🇹_3"
    type: vless
    server: "webdisk.jaggyslawa.org"
    port: 443
    uuid: "b62e3646-b84d-443c-9c94-718b646502e0"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "www.foxsports.com"
    client-fingerprint: "random"
    reality-opts:
      public-key: "zfsjt2A8ur0qHWIuCG7F9W4wZN3VTuL6fkTljC-9R0s"
      short-id: "dda5f542d835"
    flow: "xtls-rprx-vision"
  - name: "🇱🇹_4"
    type: vless
    server: "23.95.72.244"
    port: 53213
    uuid: "9a5e7b1c-bf39-4b1f-891f-ac87824ee38f"
