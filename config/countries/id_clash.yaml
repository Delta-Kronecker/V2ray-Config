name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 94.140.14.14
    - 64.6.64.6
    - 84.200.69.80
    - 76.76.19.19
    - 8.26.56.26
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://doh.comodo.com/dns-query
    - https://doh.mullvad.net/dns-query
    - https://doh.dns.mullvad.net/dns-query
    - https://freedns.controld.com/p0
    - https://freedns.controld.com/family

proxies:
  - name: "🇮🇩_1"
    type: vless
    server: "202.155.14.176"
    port: 443
    uuid: "02e2d68f-9982-4467-ad47-00cbeeae30e6"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "id.cdn-global.pro"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "UdeZc5DrXa8lWOET4wlBp55-nXskqsvoU-2kVvd3zBg"
      short-id: "7a3f9e2b1c8d4f6a"
    flow: "xtls-rprx-vision"
  - name: "🇮🇩_2"
    type: trojan
    server: "qfdfsg.wsone.icu"
    port: 443
    password: "M7v%w11Se*"
    sni: "qfdfsg.wsone.icu"
    skip-cert-verify: true
    udp: true
  - name: "🇮🇩_3"
    type: trojan
    server: "172.232.250.160"
    port: 443
    password: "788f2b96-47e2-4302-a417-511b6fd7d09c"
    sni: "172.232.250.160"
    skip-cert-verify: true
    udp: true

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"

  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇮🇩_1"
      - "🇮🇩_2"
      - "🇮🇩_3"


