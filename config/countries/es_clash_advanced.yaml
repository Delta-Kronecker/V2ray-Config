      - "🇪🇸_25"
      - "🇪🇸_26"

  - name: "LB-CDN"
    type: load-balance
    strategy: round-robin
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    proxies:
      - "🇪🇸_14"
      - "🇪🇸_15"
      - "🇪🇸_16"
      - "🇪🇸_17"
      - "🇪🇸_18"
