name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇬🇪_1"
    type: vless
    server: "93.190.9.227"
    port: 3090
    uuid: "3426bbf0-ed82-4400-94f2-923e62f808cd"
    udp: true
    network: grpc
    grpc-opts:
      grpc-service-name: "vless"
  - name: "🇬🇪_2"
    type: vless
    server: "93.190.9.227"
    port: 3090
    uuid: "9004110f-bb2e-429d-beb6-051e7babfb64"
    udp: true
    network: grpc
    grpc-opts:
      grpc-service-name: "vless"
  - name: "🇬🇪_3"
    type: vless
    server: "93.190.9.109"
    port: 3090
    uuid: "fd5b0832-76a9-44a2-8f7b-fa5306900160"
    udp: true
    network: grpc
    grpc-opts:
      grpc-service-name: "vless"
  - name: "🇬🇪_4"
    type: vless
    server: "93.190.8.94"
    port: 3090
    uuid: "fd5b0832-76a9-44a2-8f7b-fa5306900160"
    udp: true
    network: grpc
    grpc-opts:
      grpc-service-name: "vless"
  - name: "🇬🇪_5"
    type: vless
    server: "93.190.9.196"
    port: 3090
    uuid: "fd5b0832-76a9-44a2-8f7b-fa5306900160"
    udp: true
    network: grpc
    grpc-opts:
      grpc-service-name: "vless"
  - name: "🇬🇪_6"
    type: vless
    server: "93.190.9.160"
    port: 3090
    uuid: "c4dc2569-f444-4a48-aba9-b1886e36a5e2"
    udp: true
    network: grpc
    grpc-opts:
      grpc-service-name: "vless"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇬🇪_1"
      - "🇬🇪_2"
      - "🇬🇪_3"
      - "🇬🇪_4"
      - "🇬🇪_5"
      - "🇬🇪_6"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇬🇪_1"
      - "🇬🇪_2"
      - "🇬🇪_3"
      - "🇬🇪_4"
      - "🇬🇪_5"
      - "🇬🇪_6"

rules:
  - MATCH,PROXY
