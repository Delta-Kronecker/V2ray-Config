    servername: "bg2.gacvpn.site"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "SgFQg7srP1xgjWhnSU9lpUMDRlsoLIXlw6nX-mfOdlg"
      short-id: "1f8bab7ad81089f2"
    flow: "xtls-rprx-vision"
