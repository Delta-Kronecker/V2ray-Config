name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇲🇽_1"
    type: vless
    server: "149.104.90.21"
    port: 19167
    uuid: "e9a8144e-5237-488a-afb1-9ca3d8d54c80"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "mx001.zestapp778.com"
    client-fingerprint: "firefox"
  - name: "🇲🇽_2"
    type: vless
    server: "156.252.229.11"
    port: 8443
    uuid: "3e21e3d3-6d26-4155-b851-764dd8e8c6b5"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "play.googleapis.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "7jPluypHwPilf_Mq7JOY96SwKkbK35WuIlN1HwGQ_0A"
      short-id: "974f7f8f"
  - name: "🇲🇽_3"
    type: vless
    server: "mx001.zestapp778.com"
    port: 19167
    uuid: "e9a8144e-5237-488a-afb1-9ca3d8d54c80"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "mx001.zestapp778.com"
    client-fingerprint: "chrome"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇲🇽_1"
      - "🇲🇽_2"
      - "🇲🇽_3"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇲🇽_1"
      - "🇲🇽_2"
      - "🇲🇽_3"

rules:
  - MATCH,PROXY
