    port: 443
    uuid: "1d16c6e0-1bbe-435b-b661-90043fee999c"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "notls.lukongtou.eu.org"
    network: ws
    ws-opts:
      path: "Telegram-WangCai2"
      headers:
        Host: "notls.lukongtou.eu.org"
  - name: "🇭🇺_2"
    type: vless
    server: "45.195.111.15"
    port: 443
    uuid: "45459159-1536-4e98-95b3-aa1dbbfb4172"
    udp: true
    tls: true
    skip-cert-verify: true
