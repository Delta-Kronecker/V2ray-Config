name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇭🇺_1"
    type: vless
    server: "45.9.168.17"
    port: 443
    uuid: "5d4a87fa-16f1-4b65-b217-225a31e36239"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "hu.convert-flow.net"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "8ZYjmjb0b2QJKCGMrcdhQNV28jZZPCKgIQbIdqChQ0w"
      short-id: "00a61d55a07de885"
    flow: "xtls-rprx-vision"
  - name: "🇭🇺_2"
    type: vless
    server: "2.26.139.66"
    port: 443
    uuid: "90546412-d9c5-4442-831b-e9b7ca3643de"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "kukuruza.mycdn-me.ru"
    client-fingerprint: "qq"
    reality-opts:
      public-key: "-qRasoN1QIcSdRL937b6s-Y2qOb-9OFmlaHBi7UcOSM"
      short-id: "e17b4d9a8c1f3526"
    flow: "xtls-rprx-vision"
