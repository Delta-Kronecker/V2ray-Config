    type: vless
    server: "144.31.129.42"
    port: 443
    uuid: "7b81d175-d180-4ec8-bbc5-dfe80e8d3b68"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "morphbinerkkw.ru"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "CxMPFpwhcR9Ocp-Xy_1J08mo-atdHKUf58WLOy_XlgM"
      short-id: "d9662905"
    network: grpc
    grpc-opts:
      grpc-service-name: "nexusGrpc"
  - name: "🇦🇱_2"
    type: ss
