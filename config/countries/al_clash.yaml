  - name: "🇦🇱_4"
    type: ss
    server: "130.49.189.158"
    port: 43558
    cipher: "chacha20-ietf-poly1305"
    password: "nEefHwLLpCcvZliayaa1+t/VHJgVt8nP7TxiPOJM6IE="
    udp: true

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇦🇱_1"
      - "🇦🇱_2"
      - "🇦🇱_3"
      - "🇦🇱_4"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇦🇱_1"
      - "🇦🇱_2"
      - "🇦🇱_3"
      - "🇦🇱_4"

rules:
  - MATCH,PROXY
