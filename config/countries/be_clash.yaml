name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

fragment:
  enable: true
  size: "5-40"
  sleep: "1-2"

ttl: 5

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220

proxies:
  - name: "🇧🇪_1"
    type: vless
    server: "84.32.98.168"
    port: 443
    uuid: "fd90e601-a56c-42b8-aab7-aa02d26fcb04"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "app.streamru14.net"
    client-fingerprint: "firefox"
    flow: "xtls-rprx-vision"
  - name: "🇧🇪_2"
    type: vless
    server: "app.streamru14.net"
    port: 443
    uuid: "fd90e601-a56c-42b8-aab7-aa02d26fcb04"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "app.streamru14.net"
    client-fingerprint: "chrome"
    flow: "xtls-rprx-vision"
  - name: "🇧🇪_3"
    type: vless
    server: "netherlandddtun.whooisthebest.ir"
    port: 3134
    uuid: "49fe1f7b-e6f6-43dc-a67d-caade85128ba"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "aparat.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "BECatGFyR4lUoLv4-w-qOzPPDkAQt_P8yGB4cP3nE0k"
      short-id: "e9b64ca7d55f2672"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇧🇪_1"
      - "🇧🇪_2"
      - "🇧🇪_3"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇧🇪_1"
      - "🇧🇪_2"
      - "🇧🇪_3"

rules:
  - MATCH,PROXY
