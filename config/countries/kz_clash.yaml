proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇰🇿_1"
      - "🇰🇿_2"
      - "🇰🇿_3"
      - "🇰🇿_4"
      - "🇰🇿_5"
      - "🇰🇿_6"
      - "🇰🇿_7"
      - "🇰🇿_8"
      - "🇰🇿_9"
      - "🇰🇿_10"
      - "🇰🇿_11"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇰🇿_1"
      - "🇰🇿_2"
      - "🇰🇿_3"
      - "🇰🇿_4"
      - "🇰🇿_5"
      - "🇰🇿_6"
      - "🇰🇿_7"
      - "🇰🇿_8"
      - "🇰🇿_9"
      - "🇰🇿_10"
      - "🇰🇿_11"

rules:
