      - "🇸🇨_17"
      - "🇸🇨_18"
      - "🇸🇨_19"
      - "🇸🇨_20"
      - "🇸🇨_21"
      - "🇸🇨_22"
      - "🇸🇨_23"
      - "🇸🇨_24"
      - "🇸🇨_25"
      - "🇸🇨_26"

  # ── Fastest-proxy groups ──────────────────────────────────────────────────
  - name: "FAST-ALL"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🇸🇨_14"
      - "🇸🇨_15"
      - "🇸🇨_16"
      - "🇸🇨_17"
      - "🇸🇨_18"
