      - "🇿🇦_7"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇿🇦_1"
      - "🇿🇦_2"
      - "🇿🇦_3"
      - "🇿🇦_4"
      - "🇿🇦_5"
      - "🇿🇦_6"
      - "🇿🇦_7"

