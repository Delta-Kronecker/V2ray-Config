    type: vless
    server: "85.117.235.50"
    port: 443
    uuid: "f4d71fd6-1c25-4748-836b-1dbda9268039"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "cz1.animeteka.info"
    client-fingerprint: "ios"
    reality-opts:
      public-key: "PmdZ2ETkHc0zjYcs22xT_wyZk5fEpX7mg7RP396HBBc"
      short-id: "232b1b09e45325a4"
    flow: "xtls-rprx-vision"
  - name: "🇨🇿_3"
    type: vless
    server: "153.76.185.101"
    port: 3090
    uuid: "74aed07d-280c-4e14-aa20-cbb815214af8"
    udp: true
    network: grpc
    grpc-opts:
      grpc-service-name: "vless"
  - name: "🇨🇿_4"
