    udp: true
    tls: true
    skip-cert-verify: true
    servername: "origin.vpnoodles.ru"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "nIL5EeUo2XUkCaLJGbzgRm6zhF-96kWvV2VmhEt3CX4"
      short-id: "4af4102cb26e59"
    flow: "xtls-rprx-vision"
  - name: "🇨🇿_5"
