    server: "46.8.113.142"
    port: 443
    password: "LYaEYwjN8LjWTRJdCCTzW7V6gK7atJVu"
    sni: "ch-2.bexum.fun"
    skip-cert-verify: true
    udp: true

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"
      - "Load Balance"

      
  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇨🇿_1"
      - "🇨🇿_2"
      - "🇨🇿_3"
      - "🇨🇿_4"


  - name: "Load Balance"
    type: load-balance
    strategy: round-robin
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇨🇿_1"
      - "🇨🇿_2"
      - "🇨🇿_3"
      - "🇨🇿_4"

rules:
  - MATCH,PROXY
