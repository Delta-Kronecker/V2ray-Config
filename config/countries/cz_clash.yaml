    server: "ch-2.bexum.fun"
    port: 443
    password: "LYaEYwjN8LjWTRJdCCTzW7V6gK7atJVu"
    sni: "ch-2.bexum.fun"
    skip-cert-verify: true
    udp: true
  - name: "🇨🇿_4"
