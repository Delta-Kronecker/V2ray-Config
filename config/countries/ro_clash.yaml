    server: "72.5.42.70"
    port: 40443
    uuid: "ab51054f-de76-4a0f-9f3a-b44c8df86a6c"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "deepl.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "6AOnobBShzL_N96JRBNMfbL84_3myz8ZbKfZUEqRXiY"
      short-id: ""
    flow: "xtls-rprx-vision"
  - name: "🇷🇴_2"
    type: vless
    server: "151.242.191.161"
