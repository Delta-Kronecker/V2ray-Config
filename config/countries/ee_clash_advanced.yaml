      - "🇪🇪_16"
      - "🇪🇪_18"

  - name: "LB-CDN"
    type: load-balance
    strategy: round-robin
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    proxies:
      - "🇪🇪_1"
      - "🇪🇪_2"
      - "🇪🇪_4"
      - "🇪🇪_5"
      - "🇪🇪_7"
      - "🇪🇪_9"
