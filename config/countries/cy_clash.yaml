    server: "195.85.59.55"
    port: 8443
    uuid: "7a657573-2b15-7da4-f946-ea01958fc999"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "amz7goecubds.qiz56mebupbs.workers.dev"
    client-fingerprint: "ios"
    network: ws
    ws-opts:
      path: "/stream/PANEL_ZEUS/ea01958fc999/loc-0"
      headers:
        Host: "amz7goecubds.qiz56mebupbs.workers.dev"
  - name: "🇨🇾_2"
